server:
  port: 8087
spring:
  application:
    name: image-analysis-service
  datasource:
    # Local pgAdmin PostgreSQL 17 — database: order-ms (override with OMS_DB_* env vars)
    url: "${OMS_DB_URL:jdbc:postgresql://localhost:5432/order-ms}"
    username: ${OMS_DB_USER:postgres}
    password: ${OMS_DB_PASSWORD:Sizor.kom21}
    driver-class-name: ${OMS_DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: image-analysis-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
