server:
  port: 8083
spring:
  application:
    name: admin-bff-service
  datasource:
    # Local pgAdmin PostgreSQL 17 â€” database: order-ms (override with OMS_DB_* env vars)
    url: "${OMS_DB_URL:jdbc:postgresql://localhost:5432/order-ms}"
    username: ${OMS_DB_USER:postgres}
    password: ${OMS_DB_PASSWORD:}
    driver-class-name: ${OMS_DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: admin-bff-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
oms:
  catalog:
    image-dir: ${OMS_CATALOG_IMAGE_DIR:./data/catalog-images}
    scrape-delay-ms: ${OMS_CATALOG_SCRAPE_DELAY_MS:1500}
    scrape-on-startup: ${OMS_CATALOG_SCRAPE_ON_STARTUP:true}
    cron: ${OMS_CATALOG_CRON:0 0 3 * * SUN}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
