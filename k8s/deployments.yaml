apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: oms
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: oms/api-gateway:0.1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: oms-config
          env:
            - name: OMS_ORDER_URL
              value: http://order-service:8081
            - name: OMS_INTAKE_URL
              value: http://intake-service:8082
            - name: OMS_ADMIN_URL
              value: http://admin-bff-service:8083
            - name: OMS_ALLOC_URL
              value: http://allocation-service:8084
            - name: OMS_DELIVERY_URL
              value: http://delivery-service:8085
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: oms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: oms/order-service:0.1.0
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: oms-config
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-order:5432/order_pg
            - name: SPRING_DATASOURCE_USERNAME
              value: oms
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oms-db
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 45
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 25
---
